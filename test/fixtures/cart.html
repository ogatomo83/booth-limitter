<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>ショッピングカート - BOOTH</title></head><body>
<!-- 2026-11 の BOOTH のカートの作りを、個人の情報なしで写したもの (ショップが 2 つ) -->
<main role="main"><div class="manage-page-head"><h1 class="manage-page-head-title">ショッピングカート</h1></div>
<div id="js-mount-point-carts"><div class="container static-3of4 space-y-16">
  <div class="sheet sheet--p500">
    <div class="flex gap-8 justify-between pb-8"><a class="no-underline"><div class="text-16 font-bold"><span class="break-all">SEKIVRC</span></div></a></div>
    <div class="py-16"><a class="no-underline"><div class="text-16 font-bold"><span class="break-all">はるか専用メッシュ＆グラデーションテクスチャ</span></div></a>
      <a class="no-underline flex w-fit"><div class="text-14 font-bold"><span class="break-all">2点セット</span></div></a>
      <div class="text-primary500 text-16 font-bold"><span class="break-all">¥ 300</span></div></div>
    <div class="flex flex-col gap-16 pt-16 items-end"><div class="flex text-20 gap-16"><div class="flex gap-[5px]"><span>計</span><span>1</span><span>個</span></div><div class="text-primary400">¥ 300</div></div>
      <div class="flex flex-col gap-8 items-end w-full"><a class="charcoal-button">このショップのレジに進む</a></div></div>
  </div>
  <div class="sheet sheet--p500">
    <div class="flex gap-8 justify-between pb-8"><a class="no-underline"><div class="text-16 font-bold"><span class="break-all">テストショップ</span></div></a></div>
    <div class="py-16"><div class="text-primary500 text-16 font-bold"><span class="break-all">¥ 4,500</span></div></div>
    <div class="flex flex-col gap-16 pt-16 items-end"><div class="flex text-20 gap-16"><div class="flex gap-[5px]"><span>計</span><span>2</span><span>個</span></div><div class="text-primary400">¥ 4,500</div></div>
      <div class="flex flex-col gap-8 items-end w-full"><a class="charcoal-button">このショップのレジに進む</a></div></div>
  </div>
