<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スキ値札</title>
<style>
:root { --bg:#ffffff; --fg:#1d2328; --sub:#66707a; --line:#e3e6ea; --field:#f6f7f9; --ok:#1f9d6a; --low:#d48806; --over:#d64545; --accent:#2f6fd6; }
@media (prefers-color-scheme: dark) { :root { --bg:#1f2428; --fg:#e8ecef; --sub:#9aa5ae; --line:#353c42; --field:#2b3238; --accent:#6da0ff; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; width:340px; background:var(--bg); color:var(--fg); font:13px/1.6 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif; }
main { padding:16px; display:grid; gap:16px; }
h1 { font-size:15px; margin:0; display:flex; justify-content:space-between; align-items:baseline; }
h1 span, .sub { color:var(--sub); font-size:12px; font-weight:400; }
h2 { font-size:12px; color:var(--sub); margin:0 0 6px; font-weight:600; }
.big { font-size:28px; font-weight:700; color:var(--c); font-variant-numeric:tabular-nums; }
.bar { height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin:6px 0; }
.bar i { display:block; height:100%; background:var(--c); }
.row { display:flex; justify-content:space-between; gap:8px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
label { display:grid; gap:2px; font-size:12px; color:var(--sub); }
input, select { font:inherit; color:var(--fg); background:var(--field); border:1px solid var(--line); border-radius:8px; padding:5px 8px; width:100%; }
input:focus-visible, select:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.check { display:flex; gap:6px; align-items:center; color:var(--fg); }
.check input { width:auto; }
ul { list-style:none; margin:0; padding:0; display:grid; gap:4px; max-height:220px; overflow:auto; }
li { display:grid; grid-template-columns:auto 1fr auto auto; gap:8px; align-items:center; }
li .d { color:var(--sub); font-variant-numeric:tabular-nums; font-size:12px; }
li .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
li .n a { color:inherit; text-decoration:none; }
li .n a:hover { text-decoration:underline; }
li .p { font-variant-numeric:tabular-nums; }
button { font:inherit; font-size:12px; border:1px solid var(--line); background:var(--field); color:var(--fg); border-radius:8px; padding:4px 10px; cursor:pointer; }
button.x { border:0; background:none; color:var(--sub); padding:0 4px; font-size:15px; line-height:1; }
button.x:hover { color:var(--over); }
form.add { display:grid; grid-template-columns:1fr 90px auto; gap:6px; }
.months li { grid-template-columns:1fr auto; }
.empty { color:var(--sub); }
</style>
</head>
<body>
<main>
  <h1>スキ値札 <span id="period"></span></h1>
  <section>
    <div class="sub">今月の残り</div>
    <div class="big" id="rem">…</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="row sub"><span id="spent"></span><span id="days"></span></div>
  </section>
  <section>
    <h2>予算</h2>
    <div class="grid">
      <label>毎月の予算 (円)<input id="budget" type="number" min="0" step="500" inputmode="numeric"></label>
      <label>月の始まり<select id="startDay"></select></label>
    </div>
    <label class="check" style="margin-top:8px"><input id="whisper" type="checkbox"> カートに入れる前に囁く</label>
  </section>
  <section>
    <h2>今月買ったもの</h2>
    <ul id="list"></ul>
    <form class="add" id="add">
      <input id="addName" placeholder="手で足す: 商品名" required aria-label="商品名">
      <input id="addPrice" type="number" min="0" placeholder="円" required aria-label="値段">
      <button>足す</button>
    </form>
  </section>
  <section>
    <h2>これまで</h2>
    <ul class="months" id="months"></ul>
  </section>
</main>
<script src="budget.js"></script>
<script src="popup.js"></script>
</body>
</html>
